<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>하늘까지 냥 테스트</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; background: #1b1640; color: #fffaf2; padding: 16px; }
    .ok { color: #86c97a; } .fail { color: #f48fa6; } small { color: #a9adc4; }
  </style>
</head>
<body>
  <h1>하늘까지 냥 headless 테스트</h1>
  <div id="out">실행 중…</div>
  <script src="../vendor/matter.min.js"></script>
  <script type="module">
    const out = document.getElementById('out');
    const t0 = performance.now();
    const { results } = await import('./sim.test.mjs');
    const pass = results.filter(r => r.ok).length;
    out.innerHTML = `<p id="summary">${pass}/${results.length} 통과 (${((performance.now() - t0) / 1000).toFixed(1)}초)</p>` +
      results.map(r => `<div class="${r.ok ? 'ok' : 'fail'}">${r.ok ? '✔' : '✘'} ${r.name} <small>${r.detail}</small></div>`).join('');
    window.__results = results;
  </script>
</body>
</html>
